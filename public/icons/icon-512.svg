<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Maskable variant for Android adaptive icons. Two key differences
    from icon-192.svg:
      - Background is full-bleed (no rounded corners). The OS clips
        the canvas to whatever shape it likes (squircle, circle,
        teardrop, …) so we hand it a solid rectangle to work with.
      - Hat content is kept inside the maskable safe zone (centered
        80% of the canvas, i.e. (51..461) on both axes) so it never
        gets cropped by aggressive launcher masks.
  -->
  <rect width="512" height="512" fill="#C2462C"/>
  <g fill="#FAF6EF">
    <circle cx="160" cy="245" r="80"/>
    <circle cx="352" cy="245" r="80"/>
    <circle cx="256" cy="176" r="91"/>
    <rect x="149" y="272" width="213" height="85"/>
    <rect x="107" y="347" width="299" height="80" rx="27"/>
  </g>
</svg>
