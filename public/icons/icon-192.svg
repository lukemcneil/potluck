<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    Brand mark: cream chef hat on terracotta. Built from filled circles
    (puffy top), a stem, and a wider brim so the silhouette is clearly
    a hat instead of the smooth dome the previous version had — that
    one read as a chess bishop. This is the "any" purpose icon, so the
    background gets a rounded square shape itself.
  -->
  <rect width="192" height="192" rx="38" fill="#C2462C"/>
  <g fill="#FAF6EF">
    <!-- Three overlapping circles form the puffy "cloud" top. -->
    <circle cx="60" cy="92" r="30"/>
    <circle cx="132" cy="92" r="30"/>
    <circle cx="96" cy="66" r="34"/>
    <!-- Stem connects the puff to the brim with no visible seam. -->
    <rect x="56" y="102" width="80" height="32"/>
    <!-- Brim is wider than the stem so the silhouette flares out. -->
    <rect x="40" y="130" width="112" height="30" rx="10"/>
  </g>
</svg>
